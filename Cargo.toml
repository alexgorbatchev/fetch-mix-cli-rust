[package]
name = "fetch-mix-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Discover DJ set tracklists and download resumable numbered playlists"

[[bin]]
name = "fetch-mix"
path = "src/main.rs"

[dependencies]
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "40210e689762f6606776764bb3696e2685198c2e" }
cli-deps = { git = "https://github.com/alexgorbatchev/deps-rust.git", rev = "6aef62e44a87f65d31283a77b93925f456362069" }
cli-event-stream = { git = "https://github.com/alexgorbatchev/fetch-track-cli-rust.git", rev = "ceef80acf7b50cf2b156a2b7658f780234169cfc" }
comfy-table = "8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fastrand = "2"
futures-util = "0.3"
genai = "0.6.5"
htmd = "0.5.5"
html-escape = "0.2"
libc = "0.2"
regex = "1"
percent-encoding = "2.3"
reqwest = { version = "0.13", features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
which = "8"

[dev-dependencies]
tiny_http = "0.12"
flate2 = "1"
tar = "0.4"

