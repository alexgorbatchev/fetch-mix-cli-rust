[package]
name = "fetch-mix-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Discover DJ set tracklists and download resumable numbered playlists"

[[bin]]
name = "fetch-mix"
path = "src/main.rs"

[dependencies]
cli-command-kit = { path = "../cli-command-kit" }
cli-deps = { path = "../deps" }
cli-event-stream = { path = "../fetch-track-cli/crates/cli-event-stream" }
comfy-table = "8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fastrand = "2"
futures-util = "0.3"
genai = "0.6.5"
htmd = "0.5.5"
html-escape = "0.2"
libc = "0.2"
regex = "1"
percent-encoding = "2.3"
reqwest = { version = "0.13", features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
which = "8"

[dev-dependencies]
tiny_http = "0.12"
flate2 = "1"
tar = "0.4"

